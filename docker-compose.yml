services:
  postgres:
    image: postgres:17-alpine
    container_name: pager-postgres
    environment:
      POSTGRES_USER: pager
      POSTGRES_PASSWORD: pager
      POSTGRES_DB: pager
    ports: ["5433:5432"]
    volumes: ["pager-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pager -d pager"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: pager-redis
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pager-pgdata:
