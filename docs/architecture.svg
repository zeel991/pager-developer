<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1322 790" width="1322" height="790" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',Chalkboard,cursive">
  <rect width="1322" height="790" fill="#0d0d0d"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#e8e8e8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#e8e8e8" stroke-width="1.5" stroke-linecap="round">

    <!-- Datadog group -->
    <rect x="122" y="57" width="538" height="171" rx="14" stroke-dasharray="7 6" stroke-width="1.3"/>
    <text x="391" y="107" fill="#f2f2f2" font-size="34" text-anchor="middle" stroke="none">Datadog</text>
    <rect x="208" y="148" width="114" height="28" rx="8"/>
    <text x="265" y="167" fill="#f2f2f2" font-size="11" text-anchor="middle" stroke="none">Vercel</text>
    <rect x="355" y="148" width="111" height="28" rx="8"/>
    <text x="410" y="167" fill="#f2f2f2" font-size="11" text-anchor="middle" stroke="none">railway</text>
    <rect x="484" y="148" width="116" height="28" rx="8"/>
    <text x="542" y="167" fill="#f2f2f2" font-size="11" text-anchor="middle" stroke="none">render</text>

    <!-- agent -->
    <circle cx="412" cy="309" r="55"/>
    <text x="412" y="313" fill="#f2f2f2" font-size="11" text-anchor="middle" stroke="none">agent</text>

    <path d="M262 180 L385 262" marker-end="url(#a)"/>
    <path d="M410 180 L412 248" marker-end="url(#a)"/>
    <path d="M538 180 L446 268" marker-end="url(#a)"/>

    <!-- agent with GitHub access -->
    <rect x="624" y="258" width="209" height="52" rx="10"/>
    <text x="728" y="290" fill="#f2f2f2" font-size="14" text-anchor="middle" stroke="none">agent with GitHub access</text>
    <path d="M448 350 Q560 400 672 322" marker-end="url(#a)"/>

    <!-- Claude -->
    <rect x="1003" y="83" width="160" height="36" rx="11"/>
    <text x="1083" y="106" fill="#f2f2f2" font-size="13" text-anchor="middle" stroke="none">Claude</text>
    <path d="M838 256 L999 110" marker-end="url(#a)"/>

    <!-- github -->
    <rect x="947" y="264" width="272" height="46" rx="10"/>
    <text x="1083" y="292" fill="#f2f2f2" font-size="12" text-anchor="middle" stroke="none">github</text>
    <path d="M1083 123 L1083 258" marker-end="url(#a)"/>

    <!-- fix + PR -->
    <rect x="1004" y="436" width="253" height="61" rx="10"/>
    <text x="1130" y="460" fill="#f2f2f2" font-size="15" text-anchor="middle" stroke="none">Work on the fix and</text>
    <text x="1130" y="482" fill="#f2f2f2" font-size="15" text-anchor="middle" stroke="none">Raise the PR</text>
    <path d="M1108 314 L1128 430" marker-end="url(#a)"/>

    <!-- slack -->
    <rect x="625" y="453" width="125" height="41" rx="10"/>
    <text x="687" y="478" fill="#f2f2f2" font-size="11" text-anchor="middle" stroke="none">slack</text>
    <path d="M1000 342 L757 462" marker-end="url(#a)"/>
    <text x="918" y="382" fill="#f2f2f2" font-size="14" text-anchor="middle" stroke="none" transform="rotate(-26 918 382)">Figure out the issue</text>
    <path d="M1000 471 L757 471" marker-end="url(#a)"/>
    <text x="881" y="487" fill="#f2f2f2" font-size="14" text-anchor="middle" stroke="none">Team Review</text>

    <!-- production -->
    <rect x="581" y="636" width="257" height="44" rx="10"/>
    <text x="710" y="663" fill="#f2f2f2" font-size="13" text-anchor="middle" stroke="none">production</text>
    <path d="M687 500 L709 630" marker-end="url(#a)"/>

    <!-- notion summary -->
    <rect x="230" y="558" width="303" height="70" rx="12" stroke-dasharray="7 6" stroke-width="1.3"/>
    <text x="381" y="586" fill="#f2f2f2" font-size="17" text-anchor="middle" stroke="none">summary of whatever</text>
    <text x="381" y="609" fill="#f2f2f2" font-size="17" text-anchor="middle" stroke="none">happened to notion</text>
    <path d="M760 690 Q640 760 400 634" marker-end="url(#a)"/>

    <!-- mail -->
    <rect x="188" y="390" width="198" height="72" rx="12" stroke-dasharray="7 6" stroke-width="1.3"/>
    <text x="287" y="440" fill="#f2f2f2" font-size="34" text-anchor="middle" stroke="none">mail</text>
    <path d="M318 554 L299 470" stroke-dasharray="6 5" marker-end="url(#a)"/>
  </g>
</svg>
